<!DOCTYPE html>
<html lang="en">
    <style>
        @media screen and (width > 650px) {
            .header, .row {
                display: grid;
                grid-template-columns: 50px 100px 50px 150px 50px 250px;
                grid-auto-flow: row;
            }
        }
        div {
            border: solid purple 1pt;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="col">Col 1</div>
            <div class="col">Col 2</div>
            <div class="col">Col 1</div>
            <div class="col">Col 3</div>
            <div class="col">Col 1</div>
            <div class="col">Col 5</div>
        </div>
        <div class="row">
            <div class="col">Val 1</div>
            <div class="col">Val 2</div>
            <div class="col">Val 1</div>
            <div class="col">Val 3</div>
            <div class="col">Val 1</div>
            <div class="col">Val 5</div>
        </div>
    </div>
</body>
</html>
